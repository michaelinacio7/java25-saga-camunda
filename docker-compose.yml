services:
  camunda:
    image: camunda/camunda:8.10.0
    environment:
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "true"
      CAMUNDA_DATA_SECONDARYSTORAGE_TYPE: none
    ports:
      - "8080:8080"
      - "26500:26500"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
