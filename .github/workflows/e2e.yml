name: End-to-end

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'scripts/**'
      - 'src/main/**'
      - 'src/main/resources/processes/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'scripts/**'
      - 'src/main/**'
      - 'src/main/resources/processes/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  camunda-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run against real Camunda 8 server
        run: bash scripts/e2e.sh
      - name: Show application and Camunda logs on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/camunda-saga-e2e.log" ]; then
            cat "$RUNNER_TEMP/camunda-saga-e2e.log"
          fi
          docker compose logs --no-color || true
